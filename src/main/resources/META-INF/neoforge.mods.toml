[[mods]]
modId="tensura_dungeons_unbound"
version="1.0.0"
displayName="Tensura: Dungeons Unbound"
authors="Mineclawd"
logoFile="tensura_dungeon_ui.png"
description='''
All Tensura Dungeon mods in one jar: the procedural dungeon runtime, Tensura Additions, Fog Barriers, the native HUD, the dungeon UI, lock-on and the health cap lift.
On a new world it builds the dungeon hub (with its NPCs, talking through Dialogue Studio) in the dungeon dimension and registers it, so overworld rifts and the Expedition Table work right away.
'''

