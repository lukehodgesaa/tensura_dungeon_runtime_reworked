[impacts]
	#Bounce entities away from animated fog panels.
	bounceEnabled = true
	#Minimum horizontal speed applied away from a fog barrier.
	# Default: 0.72
	# Range: 0.05 ~ 4.0
	bounceStrength = 0.72
	#Minimum upward velocity added to a barrier bounce.
	# Default: 0.16
	# Range: 0.0 ~ 1.5
	bounceVerticalLift = 0.16
	#Per-entity cooldown that prevents repeated bounce loops.
	# Default: 4
	# Range: 1 ~ 40
	bounceCooldownTicks = 4
	#Allow creative-mode players through rendered fog panels.
	creativeModeExempt = false
	#Play a sound and small particle burst when a barrier reacts.
	effects = true

[projectiles]
	#Reflect projectiles from panels and placed Golden Fog Barrier blocks.
	reflect = true
	#Speed retained by the reflected normal component.
	# Default: 1.0
	# Range: 0.1 ~ 3.0
	speedMultiplier = 1.0
	#Per-projectile cooldown that prevents reflection loops.
	# Default: 2
	# Range: 1 ~ 20
	cooldownTicks = 2
